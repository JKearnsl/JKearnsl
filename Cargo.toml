[package]
name = "jkearnsl"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
# Frontend
leptos = { version = "0.8.19", features = ["nightly"] }
leptos_meta = { version = "0.8.6" }
leptos_router = { version = "0.8.13", features = ["nightly"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement",
    "Storage", "EventTarget", "ScrollToOptions",
    "MouseEvent", "KeyboardEvent",
] }

# Backend
actix-web = {  version = "4.13.0", features = ["rustls-0_23", "macros"], optional = true }
leptos_actix = { version = "0.8",  optional = true}
actix-files = { version = "0.6", optional = true }
rustls = { version = "0.23", optional = true }
rustls-pemfile = { version = "2.2", optional = true }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
log = { version = "0.4", optional = true }
pretty_env_logger = { version = "0.5", optional = true }
serde = { version = "1.0", features = ["derive"] }
derive_more = { version = "2.0", features = ["display", "error"], optional = true }
serde_json = { version = "1.0", optional = true }
tokio = { version = "1.52", features = [
    "rt",
    "rt-multi-thread",
    "macros"
], optional = true }
slug = "0.1"
pulldown-cmark = { version = "0.13.4" }

# Database
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "sqlite",
    "sqlx-sqlite",
    "chrono",
    "migrate"
], optional = true }

# Etc
argon2 = { version = "0.5", optional = true }
sha2 = { version = "0.10", optional = true }
async-trait = { version = "0.1.88", optional = true }
rand = { version = "0.10", optional = true }
nanoid = { version = "0.5", optional = true }
mimalloc = { version = "0.1", default-features = false, optional = true }
cfg-if = "1"
thiserror = "2.0"
server_fn = "0.8"

[features]
hydrate = ["leptos/hydrate"]
ssr = [
    "dep:leptos_actix",
    "dep:actix-web",
    "dep:actix-files",
    "dep:async-trait",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:log",
    "dep:pretty_env_logger",
    "dep:tokio",
    "dep:sqlx",
    "dep:argon2",
    "dep:sha2",
    "dep:serde_json",
    "dep:derive_more",
    "dep:rand",
    "dep:nanoid",
    "dep:mimalloc",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"


[package.metadata.leptos]
output-name = "jkearnsl"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "assets"
reload-port = 3001

browserquery = "defaults"

bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
tailwind-input-file = "assets/css/tailwind.css"
